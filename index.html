<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Саша · поздравляю</title>

<!--
==================================================================
  ✏️  МЕНЯТЬ ТУТ — всё персональное в блоке  const DATA = { ... }
      ниже в скрипте: имя, повод, строка «на повторе», ТЕКСТ, подписи.
  🎵 Музыка — положи mp3 в корень, впиши имя файла в DATA.music ("" — без кнопки)
  Картинки лежат в КОРНЕ репозитория (рядом с index.html).
==================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#eef4fa;
  --ink:#1d3147;
  --ink-soft:#546c84;
  --accent:#5b91c4;
  --line:#c7d8e8;
  --card:#fbfdff;
  --photo-bg:#d9e6f2;
  --soft-shadow:0 30px 60px -36px rgba(29,49,71,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Golos Text",system-ui,sans-serif;color:var(--ink);background:var(--paper);
  overflow-x:hidden;line-height:1.65;-webkit-font-smoothing:antialiased}
#confetti{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ---------- COVER (разворот) ---------- */
.cover{display:flex;flex-direction:column;min-height:100svh}
.cover-photo{position:relative;height:52svh;background:var(--photo-bg);overflow:hidden}
.cover-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;
  transform:scale(1.06);animation:slowzoom 16s ease-out forwards}
@keyframes slowzoom{to{transform:scale(1)}}
.cover-text{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:40px 28px 48px;position:relative}
.kicker{font-size:14px;letter-spacing:.04em;color:var(--accent);font-weight:500;
  opacity:0;animation:fade .8s .2s ease both}
.name{font-family:"Cormorant",serif;font-weight:600;color:var(--ink);
  font-size:clamp(84px,24vw,150px);line-height:.92;letter-spacing:.01em;margin:.04em 0 .14em;
  opacity:0;animation:fade .9s .45s ease both}
.rule{width:54px;height:2px;background:var(--accent);margin-bottom:18px;
  opacity:0;animation:fade .8s .7s ease both;transform-origin:left}
.sub{font-size:clamp(17px,4.6vw,21px);color:var(--ink-soft);font-weight:500;
  opacity:0;animation:fade .8s .85s ease both}
.nowplaying{margin-top:22px;font-size:13px;color:var(--ink-soft);letter-spacing:.02em;
  display:flex;align-items:center;gap:7px;opacity:0;animation:fade .8s 1s ease both}
.nowplaying .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.scrolldown{position:absolute;right:28px;bottom:26px;font-size:12px;color:var(--ink-soft);
  letter-spacing:.14em;opacity:0;animation:fade 1s 1.3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

@media(min-width:820px){
  .cover{flex-direction:row}
  .cover-text{order:1;width:46%;padding:0 6vw}
  .cover-photo{order:2;width:54%;height:100svh}
  .cover-photo img{object-position:50% 38%}
}

/* ---------- LETTER ---------- */
.letter{max-width:600px;margin:0 auto;padding:16vh 28px 12vh}
.letter p{font-family:"Cormorant",serif;font-size:clamp(21px,5vw,27px);line-height:1.5;
  color:var(--ink);margin-bottom:20px}
.letter .placeholder{color:#9db3c8;font-style:italic;font-family:"Golos Text",sans-serif;
  font-size:16px}

/* ---------- MOMENTS ---------- */
.moments{max-width:960px;margin:0 auto;padding:0 20px 14vh}
.grid{columns:2;column-gap:20px}
@media(min-width:760px){.grid{column-gap:26px}}
.ph{break-inside:avoid;margin-bottom:20px;border-radius:10px;overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--soft-shadow);background:var(--card);cursor:pointer}
.ph img{display:block;width:100%;height:auto}
.ph .cap{padding:9px 12px 11px;font-size:13px;color:var(--ink-soft);letter-spacing:.02em}

/* ---------- END ---------- */
.end{text-align:center;padding:8vh 24px 16vh}
.end .line{font-family:"Cormorant",serif;font-style:italic;font-weight:500;
  color:var(--ink-soft);font-size:clamp(20px,5vw,26px);margin-bottom:6px}
.end .big{font-family:"Cormorant",serif;font-weight:600;color:var(--ink);
  font-size:clamp(66px,20vw,128px);line-height:1}

/* ---------- MUSIC ---------- */
.music-wrap{position:fixed;right:16px;bottom:16px;z-index:40;display:none;
  flex-direction:column;align-items:center;gap:10px}
.music-btn{position:relative;width:54px;height:54px;border:none;border-radius:50%;
  cursor:pointer;background:var(--ink);box-shadow:0 10px 26px -8px rgba(29,49,71,.7);
  display:flex;align-items:center;justify-content:center;transition:transform .25s ease}
.music-btn:active{transform:scale(.9)}
.music-btn svg{width:20px;height:20px;fill:#fff}
.music-btn .i-pause{display:none}
.music-btn.playing .i-play{display:none}
.music-btn.playing .i-pause{display:block}
.music-btn.playing::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  border:2px solid rgba(91,145,196,.6);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
.seek{width:116px;accent-color:var(--accent);cursor:pointer;opacity:0;transform:translateY(8px);
  pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.music-wrap:hover .seek,.seek.show{opacity:1;transform:none;pointer-events:auto}

/* ---------- LIGHTBOX ---------- */
.lb{position:fixed;inset:0;z-index:50;background:rgba(18,34,54,.9);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px}
.lb.open{display:flex;animation:fadein .3s ease}
.lb img{max-width:100%;max-height:88vh;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lb-close{position:absolute;top:16px;right:22px;color:#fff;font-size:32px;cursor:pointer;z-index:3;opacity:.9}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;color:#fff;font-size:44px;
  cursor:pointer;opacity:.8;user-select:none;padding:12px 14px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.lb-nav:active{opacity:.45}.lb-prev{left:4px}.lb-next{right:4px}
@keyframes fadein{from{opacity:0}to{opacity:1}}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .kicker,.name,.rule,.sub,.nowplaying,.scrolldown{opacity:1;transform:none}
  .cover-photo img{transform:scale(1)}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<!-- COVER -->
<header class="cover">
  <div class="cover-text">
    <div class="kicker" id="kicker">поздравляю</div>
    <h1 class="name" id="name">Саша</h1>
    <div class="rule"></div>
    <div class="sub" id="sub">с днём рождения</div>
    <div class="nowplaying" id="nowplaying"><span class="dot"></span><span id="songTxt"></span></div>
    <div class="scrolldown">листать ↓</div>
  </div>
  <div class="cover-photo"><img src="hero.jpg" alt=""></div>
</header>

<!-- LETTER -->
<section class="letter"><div id="msgBody"></div></section>

<!-- MOMENTS -->
<section class="moments"><div class="grid" id="grid"></div></section>

<!-- END -->
<footer class="end">
  <div class="line" id="endLine">с днём рождения,</div>
  <div class="big" id="endName">Саша</div>
</footer>

<!-- MUSIC -->
<audio id="bgm" loop preload="auto"></audio>
<div class="music-wrap" id="musicWrap">
  <input type="range" class="seek" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
  <button class="music-btn" id="musicBtn" aria-label="Музыка">
    <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <div class="lb-close" id="lbClose">✕</div>
  <div class="lb-nav lb-prev" id="lbPrev">‹</div>
  <img id="lbImg" alt="">
  <div class="lb-nav lb-next" id="lbNext">›</div>
</div>

<script>
/* ==================================================================
   ✏️  ВСЁ ПЕРСОНАЛЬНОЕ — МЕНЯЙ ТОЛЬКО ЗДЕСЬ
   ================================================================== */
const DATA = {
  name: "Саша",
  kicker: "поздравляю",          // строчка над именем
  sub: "с днём рождения",         // под именем
  song: "Stray Kids — Youtiful",  // строка «на повторе» ("" — скрыть)

  // 💬 ТЕКСТ. Каждая строка = абзац. [] → бледная заглушка.
  message: [
    // "Первый абзац...",
  ],

  endLine: "с днём рождения,",    // мелкая строка в финале
  endName: "Саша",                // крупно в финале

  music: "",                       // имя mp3 в корне ("" — без кнопки)

  // 📸 фото + подписи (под фото, мелким). cap:"" — без подписи.
  photos: [
    { src:"g1.jpg", cap:"" },
    { src:"g2.jpg", cap:"" },
    { src:"g3.jpg", cap:"" }
  ]
};
/* ================================================================== */

const $=id=>document.getElementById(id);
$("name").textContent=DATA.name;
$("kicker").textContent=DATA.kicker;
$("sub").textContent=DATA.sub;
$("endLine").textContent=DATA.endLine;
$("endName").textContent=DATA.endName;
document.title=DATA.name+" · "+DATA.kicker;

// «на повторе»
if(DATA.song){$("songTxt").textContent="на повторе: "+DATA.song+" ♫";}
else{$("nowplaying").style.display="none";}

// текст
$("msgBody").innerHTML = (DATA.message && DATA.message.length)
  ? DATA.message.map(t=>`<p>${t}</p>`).join("")
  : `<p class="placeholder">(здесь будет текст — впиши его в DATA.message)</p>`;

// галерея
const grid=$("grid");
DATA.photos.forEach((p,i)=>{
  const d=document.createElement("div");
  d.className="ph";
  d.innerHTML=`<img src="${p.src}" alt="" loading="lazy">`+(p.cap?`<div class="cap">${p.cap}</div>`:"");
  d.addEventListener("click",()=>openLB(i));
  grid.appendChild(d);
});

// лайтбокс (свайп / стрелки / клавиши)
const lb=$("lb"),lbImg=$("lbImg");
const lbList=DATA.photos.map(p=>p.src);let lbIdx=0;
function openLB(i){lbIdx=i;lbImg.src=lbList[i];lb.classList.add("open");}
function lbGo(d){lbIdx=(lbIdx+d+lbList.length)%lbList.length;lbImg.src=lbList[lbIdx];}
function lbClose(){lb.classList.remove("open");}
$("lbClose").addEventListener("click",e=>{e.stopPropagation();lbClose();});
$("lbPrev").addEventListener("click",e=>{e.stopPropagation();lbGo(-1);});
$("lbNext").addEventListener("click",e=>{e.stopPropagation();lbGo(1);});
lb.addEventListener("click",e=>{if(e.target===lb)lbClose();});
lbImg.addEventListener("click",e=>e.stopPropagation());
let _tx=0;
lb.addEventListener("touchstart",e=>{_tx=e.touches[0].clientX;},{passive:true});
lb.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>40)lbGo(dx<0?1:-1);},{passive:true});
addEventListener("keydown",e=>{
  if(!lb.classList.contains("open"))return;
  if(e.key==="Escape")lbClose();else if(e.key==="ArrowLeft")lbGo(-1);else if(e.key==="ArrowRight")lbGo(1);
});

// музыка (автоплей + скрытая перемотка)
const bgm=$("bgm"),musicBtn=$("musicBtn"),musicWrap=$("musicWrap"),seek=$("seek");
if(DATA.music){
  bgm.src=DATA.music;musicWrap.style.display="flex";
  const setP=on=>musicBtn.classList.toggle("playing",on);
  const play=()=>bgm.play().then(()=>setP(true)).catch(()=>{});
  const toggle=()=>{ if(bgm.paused){play();} else{bgm.pause();setP(false);} };
  let showT;
  const revealSeek=()=>{seek.classList.add("show");clearTimeout(showT);
    showT=setTimeout(()=>seek.classList.remove("show"),4000);};
  musicBtn.addEventListener("click",()=>{toggle();revealSeek();});
  bgm.addEventListener("timeupdate",()=>{if(bgm.duration)seek.value=(bgm.currentTime/bgm.duration)*1000;});
  seek.addEventListener("input",()=>{if(bgm.duration)bgm.currentTime=(seek.value/1000)*bgm.duration;revealSeek();});
  play();
  ["pointerdown","touchstart","keydown","scroll"].forEach(ev=>
    addEventListener(ev,()=>{if(bgm.paused)play();},{once:true,passive:true}));
}

// конфетти при открытии (голубое, скромное)
(function(){
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const cv=$("confetti"),ctx=cv.getContext("2d");let W,H;
  const resize=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;};
  resize();addEventListener("resize",resize);
  const colors=["#5b91c4","#9fc5e8","#cfe0f0","#ffffff","#bcd4ea","#7fb0d8"];
  const P=[];
  for(let i=0;i<110;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*0.6,
    vx:(Math.random()-0.5)*1.4,vy:2+Math.random()*3.2,s:5+Math.random()*6,
    rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.28,c:colors[i%colors.length],sq:Math.random()<0.5});
  function frame(){
    ctx.clearRect(0,0,W,H);let alive=0;
    for(const p of P){ if(p.y>H+30)continue;alive++;
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;p.rot+=p.vr;p.vx+=Math.sin(p.y*0.01)*0.05;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
      if(p.sq)ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);
      else{ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.28);ctx.fill();}
      ctx.restore();}
    if(alive>0)requestAnimationFrame(frame);else ctx.clearRect(0,0,W,H);
  }
  setTimeout(()=>requestAnimationFrame(frame),400);
})();
</script>
</body>
</html>
