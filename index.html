<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Саша, с днём рождения</title>

<!--
==================================================================
  ✏️  МЕНЯТЬ ТУТ — всё персональное в блоке  const DATA = { ... }
      ниже в скрипте: имя, подзаголовок, ТЕКСТ, подписи к фото.
  🎈 Возраст/шарики — через DATA.age и DATA.balloonsImg (можно оставить "" — не покажется)
  🎵 Музыка — положи mp3 в корень, впиши имя файла в DATA.music ("" убирает кнопку)
  Картинки лежат в КОРНЕ репозитория (рядом с index.html).
==================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#f4f8fc;
  --bg2:#dce9f5;
  --mist:#cfe0f0;
  --blue:#6fa8dc;
  --blue-deep:#3d6fa3;
  --steel:#2f5273;
  --ink:#44566b;
  --cream:#fcfeff;
  --shadow:24px 40px 80px -42px rgba(47,82,115,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Onest",system-ui,sans-serif;color:var(--ink);background:var(--bg1);
  overflow-x:hidden;line-height:1.6}

.bg{position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(60% 45% at 18% 10%, #eaf3fb 0%, transparent 60%),
    radial-gradient(55% 40% at 85% 22%, #e3edf6 0%, transparent 55%),
    radial-gradient(70% 55% at 50% 108%, #cfe1f2 0%, transparent 60%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 58%, #cfe0f0 100%);}

/* конфетти-слой */
#confetti{position:fixed;inset:0;z-index:45;pointer-events:none}

/* атмосфера: тонкие искры, мерцают на месте */
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.spark{position:absolute;color:#fff;filter:drop-shadow(0 0 6px rgba(130,180,225,.9));
  animation:twinkle var(--d,5s) ease-in-out infinite;animation-delay:var(--delay,0s)}
.spark.blue{color:#cfe4f6;filter:drop-shadow(0 0 7px rgba(111,168,220,.9))}
@keyframes twinkle{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.8;transform:scale(1.05)}}

/* ---- HERO ---- */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;
  justify-content:center;overflow:hidden}
.hero-img{position:absolute;inset:0;background:url("hero.jpg") center/cover no-repeat;
  transform:scale(1.07);animation:heroZoom 15s ease-out forwards}
@keyframes heroZoom{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(40,70,110,.10) 0%, transparent 30%,
    rgba(30,55,90,.18) 60%, rgba(25,45,75,.62) 100%)}
.hero-inner{position:relative;z-index:2;text-align:center;padding:0 24px 12vh;color:#fff}
.eyebrow{font-weight:500;font-size:clamp(17px,4.8vw,24px);
  opacity:0;animation:rise .9s .3s ease both;text-shadow:0 2px 18px rgba(20,45,80,.6)}
.name{font-family:"Unbounded",sans-serif;font-weight:500;display:flex;justify-content:center;
  font-size:clamp(64px,22vw,150px);line-height:1.05;margin:.1em 0 .2em;letter-spacing:-.01em;
  text-shadow:0 8px 40px rgba(20,45,80,.55)}
.name span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(40px) scale(.9);
  animation:letter 1s cubic-bezier(.2,.8,.2,1) both,sway 5s ease-in-out infinite;
  animation-delay:calc(.5s + var(--i)*.14s),calc(1.8s + var(--i)*.3s)}
@keyframes letter{to{opacity:1;filter:blur(0);transform:none}}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.age{opacity:0;animation:rise 1s .8s ease both;margin:0 0 .3em}
.age .num{font-family:"Unbounded",sans-serif;font-size:clamp(34px,11vw,66px);line-height:1;color:#eaf4ff}
.age img{max-width:min(50vw,230px);height:auto;filter:drop-shadow(0 10px 24px rgba(30,60,100,.45))}
.subline{font-weight:500;font-size:clamp(15px,4.4vw,20px);opacity:0;animation:rise 1s 1.05s ease both;text-shadow:0 2px 16px rgba(20,45,80,.55)}
.scroll-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:2;
  color:#fff;text-align:center;opacity:0;
  animation:riseC 1s 1.5s ease both, bob 2.4s 2.1s ease-in-out infinite}
.scroll-hint b{display:block;font-weight:500;font-size:13px;opacity:.9}
.scroll-hint .arw{font-size:20px;line-height:1;opacity:.8;margin-top:2px}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes riseC{from{opacity:0;transform:translate(-50%,26px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}

/* ---- MESSAGE ---- */
.band{overflow:hidden;background:linear-gradient(90deg,var(--blue-deep),var(--blue),var(--blue-deep));
  color:#fff;transform:rotate(-2deg) scale(1.05);margin:-26px 0 0;position:relative;z-index:3;
  box-shadow:0 14px 40px -16px rgba(47,82,115,.7)}
.band-in{display:flex;width:max-content;animation:mq 26s linear infinite}
.band span{font-family:"Unbounded",sans-serif;font-weight:400;font-size:clamp(15px,4vw,20px);padding:16px 22px;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.message{max-width:640px;margin:0 auto;padding:13vh 20px 6vh;text-align:center}
.glass{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.95);border-radius:30px;
  padding:clamp(28px,7vw,46px);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.message p{font-size:clamp(16px,4.2vw,19px);color:var(--ink);margin-bottom:16px}
.message .placeholder{color:#9bb2c8;font-style:italic}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;
  margin:34px 0 0;color:var(--blue);font-size:14px;letter-spacing:.3em}
.divider::before,.divider::after{content:"";height:1px;width:66px;
  background:linear-gradient(90deg,transparent,var(--mist))}
.divider::after{background:linear-gradient(90deg,var(--mist),transparent)}

/* ---- GALLERY ---- */
.gallery-wrap{padding:2vh 16px 8vh;max-width:920px;margin:0 auto}
.masonry{column-count:2;column-gap:14px}
@media(min-width:720px){.masonry{column-count:3;column-gap:18px}}
/* телефон: две квадратные рядом, последняя (если нечётная) — на всю ширину */
@media(max-width:719px){
  .masonry{column-count:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .masonry .card-ph{margin-bottom:0}
  .masonry .card-ph img{aspect-ratio:1/1;object-fit:cover}
  .masonry .card-ph:last-child:nth-child(odd){grid-column:1/-1}
  .masonry .card-ph:last-child:nth-child(odd) img{aspect-ratio:auto}
}
.card-ph{break-inside:avoid;margin-bottom:14px;position:relative;border-radius:24px;border:4px solid #fff;
  overflow:hidden;box-shadow:var(--shadow);background:var(--cream);cursor:pointer;
  opacity:0;transform:translateY(30px) scale(.98);transition:transform .7s ease,opacity .7s ease}
.card-ph.show{opacity:1;transform:rotate(var(--r,0deg))}
.card-ph.show:hover{transform:rotate(0) scale(1.03);z-index:2}
.card-ph img{display:block;width:100%;height:auto;transition:transform .6s ease}
.card-ph:hover img{transform:scale(1.05)}
.card-ph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(30,60,100,.38));opacity:0;transition:.4s}
.card-ph:hover::after{opacity:1}
.cap{position:absolute;left:12px;bottom:10px;right:12px;z-index:2;color:#fff;
  font-weight:600;font-size:18px;opacity:0;transform:translateY(6px);transition:.4s;
  text-shadow:0 2px 10px rgba(20,40,70,.7)}
.card-ph:hover .cap{opacity:1;transform:none}

/* ---- FOOTER ---- */
.foot{text-align:center;padding:6vh 24px 12vh}
.foot .to{font-weight:500;font-size:clamp(17px,4.6vw,22px);color:var(--blue-deep);margin-bottom:10px}
.foot .big{font-family:"Unbounded",sans-serif;font-weight:500;color:var(--steel);
  font-size:clamp(52px,19vw,120px);line-height:1.05;margin-bottom:16px;
  background:linear-gradient(100deg,var(--steel) 20%,var(--blue) 50%,var(--steel) 80%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.foot .from{font-weight:500;color:var(--ink);font-size:clamp(14px,4vw,17px)}
.shoot{position:fixed;top:-5vh;left:0;width:140px;height:2px;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,transparent,#fff);border-radius:2px;opacity:0;transform:rotate(35deg);
  animation:shoot 9s linear infinite;animation-delay:var(--sd)}
@keyframes shoot{0%{opacity:0;transform:translate(var(--sx),0) rotate(35deg)}3%{opacity:.95}
 12%{opacity:0;transform:translate(calc(var(--sx) + 55vw),55vh) rotate(35deg)}100%{opacity:0}}

/* ---- BALLOONS ---- */
.bln{position:absolute;z-index:1;height:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;
  filter:drop-shadow(0 14px 18px rgba(30,60,100,.35));rotate:var(--rot,0deg);transform-origin:50% 90%;
  animation:up 1.7s cubic-bezier(.16,1,.3,1) calc(var(--dl,0s)*.4) both,bobb 6s ease-in-out calc(var(--dl,0s)*.4 + 1.7s) infinite}
@keyframes up{from{transform:translateY(60vh) scale(.85);opacity:0}25%{opacity:1}to{transform:none;opacity:1}}
@keyframes bobb{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.bln.pop{animation:pop .28s ease-out forwards;pointer-events:none}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.hero-inner{pointer-events:none}
.age{display:flex;justify-content:center;align-items:flex-end;gap:2px}
.age img.dg{height:clamp(84px,24vw,140px);width:auto;max-width:none;rotate:var(--rot,0deg);
  filter:drop-shadow(0 10px 20px rgba(20,50,90,.5));animation:bobb 5s ease-in-out var(--dl,0s) infinite}
.foot{position:relative;overflow:hidden}
.foot .bln{opacity:0;animation:none}
.foot.in .bln{opacity:1;animation:up 1.7s cubic-bezier(.16,1,.3,1) calc(var(--dl,0s)*.4) both,bobb 6s ease-in-out calc(var(--dl,0s)*.4 + 1.7s) infinite}
.foot .to,.foot .big,.foot .from{position:relative;z-index:2}
@media(prefers-reduced-motion:reduce){.bln,.foot .bln{opacity:1;animation:none}}

/* ---- MINI PLAYER ---- */
.music-wrap{position:fixed;left:14px;bottom:14px;z-index:40;display:none;overflow:hidden;
  width:62px;align-items:center;gap:0;padding:7px;border-radius:99px;
  transition:width .6s cubic-bezier(.16,1,.3,1),gap .6s,padding .6s;
  background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 40px -16px rgba(47,82,115,.6)}
.music-btn{position:relative;flex:none;width:46px;height:46px;border:none;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--blue-deep));display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px -4px rgba(47,82,115,.7);transition:transform .2s}
.music-btn:active{transform:scale(.92)}
.music-btn svg{width:18px;height:18px;fill:#fff}
.music-btn .i-pause{display:none}.music-btn.playing .i-play{display:none}.music-btn.playing .i-pause{display:block}
.music-wrap.on{width:min(calc(100vw - 28px),330px);gap:12px;padding:7px 16px 7px 7px}
.pl-body{flex:1;min-width:0;opacity:0;transition:opacity .3s}
.music-wrap.on .pl-body{opacity:1;transition:opacity .5s .25s}
.pl-title{font-size:13.5px;font-weight:600;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-sub{font-size:11.5px;color:var(--ink);opacity:.7;margin-bottom:5px}
.seek{display:block;width:100%;height:14px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;accent-color:var(--blue)}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--blue) var(--p,0%),#cfe0f0 var(--p,0%))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--blue-deep);margin-top:-4px;border:2px solid #fff}
.seek::-moz-range-track{height:4px;border-radius:4px;background:#cfe0f0}
.seek::-moz-range-progress{height:4px;border-radius:4px;background:var(--blue)}
.seek::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--blue-deep);border:2px solid #fff}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px;flex:none;width:0;opacity:0;transition:opacity .3s}
.music-wrap.on .eq{width:12px;opacity:1;transition:opacity .5s .25s}
.eq b{width:3px;background:var(--blue);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:.2s}.eq b:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.foot{padding-bottom:18vh}

/* ---- LIGHTBOX ---- */
.lb{position:fixed;inset:0;z-index:50;background:rgba(25,45,75,.88);
  backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.lb.open{display:flex;animation:fade .3s ease}
.lb img{max-width:100%;max-height:88vh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:34px;cursor:pointer;
  line-height:1;opacity:.9;z-index:3}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;color:#fff;
  font-size:46px;line-height:1;cursor:pointer;opacity:.8;user-select:none;
  padding:12px 14px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.lb-nav:active{opacity:.45}
.lb-prev{left:4px}.lb-next{right:4px}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .card-ph{opacity:1;transform:none}.hero-img{transform:scale(1)}
  .eyebrow,.name,.age,.subline,.scroll-hint{opacity:1}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="sky" id="sky"></div>
<i class="shoot" style="--sx:10vw;--sd:3s"></i><i class="shoot" style="--sx:45vw;--sd:7s"></i><i class="shoot" style="--sx:-5vw;--sd:11s"></i>
<canvas id="confetti"></canvas>

<!-- HERO -->
<header class="hero">
  <div class="hero-img"></div>
  <img class="bln" src="bl_hearts.png" alt="" style="--dl:.3s;--rot:-6deg;left:-5vw;bottom:24%;width:clamp(120px,34vw,250px)">
  <img class="bln" src="bl_blue.png" alt="" style="--dl:.6s;--rot:5deg;right:-7vw;bottom:38%;width:clamp(130px,38vw,280px)">
  <img class="bln" src="bl_chrome.png" alt="" style="--dl:.9s;--rot:-4deg;left:3vw;top:6%;width:clamp(80px,22vw,170px)">
  <img class="bln" src="st_blue.png" alt="" style="--dl:1.1s;--rot:12deg;right:12vw;top:9%;width:clamp(46px,13vw,90px)">
  <img class="bln" src="hr_silver.png" alt="" style="--dl:1.4s;--rot:-10deg;left:28vw;top:19%;width:clamp(40px,11vw,76px)">
  <div class="hero-inner">
    <div class="eyebrow" id="eyebrow">С днём рождения</div>
    <h1 class="name" id="name">Имя</h1>
    <div class="age" id="age"></div>
    <div class="subline" id="subline"></div>
  </div>
  <div class="scroll-hint"><b>листай вниз</b><div class="arw">↓</div></div>
</header>

<!-- MESSAGE -->
<div class="band"><div class="band-in" id="band"></div></div>

<section class="message">
  <div class="glass" id="msgBody"></div>
</section>

<!-- GALLERY -->
<section class="gallery-wrap">
  <div class="masonry" id="masonry"></div>
</section>

<!-- FOOTER -->
<footer class="foot" id="foot">
  <img class="bln" src="bl_silver.png" alt="" style="--dl:0s;--rot:-5deg;left:-4vw;bottom:4%;width:clamp(110px,30vw,220px)">
  <img class="bln" src="bl_hearts.png" alt="" style="--dl:.3s;--rot:6deg;right:-5vw;bottom:2%;width:clamp(110px,30vw,220px)">
  <img class="bln" src="st_dark.png" alt="" style="--dl:.6s;--rot:10deg;right:16vw;top:8%;width:clamp(40px,11vw,70px)">
  <img class="bln" src="st_blue.png" alt="" style="--dl:.8s;--rot:-12deg;left:18vw;top:12%;width:clamp(40px,11vw,70px)">
  <div class="to" id="footTo">С днём рождения</div>
  <div class="big" id="footBig">Имя</div>
  <div class="from" id="footFrom">с любовью</div>
</footer>

<!-- MUSIC -->
<audio id="bgm" loop preload="auto"></audio>
<div class="music-wrap" id="musicWrap">
  <button class="music-btn" id="musicBtn" aria-label="Музыка">
    <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
  <div class="pl-body">
    <div class="pl-title" id="plTitle"></div>
    <input type="range" class="seek" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
  </div>
  <div class="eq"><b></b><b></b><b></b></div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <div class="lb-close" id="lbClose">✕</div>
  <div class="lb-nav lb-prev" id="lbPrev">‹</div>
  <img id="lbImg" alt="">
  <div class="lb-nav lb-next" id="lbNext">›</div>
</div>

<script>
/* ==================================================================
   ✏️  ВСЁ ПЕРСОНАЛЬНОЕ — МЕНЯЙ ТОЛЬКО ЗДЕСЬ
   ================================================================== */
const DATA = {
  name: "Саша",
  eyebrow: "с днём рождения",   // верхняя строчка (повод)
  subline: "",                   // подзаголовок под именем ("" — скрыто)
  song: "Stray Kids — Grow Up",  // плашка «на повторе» ("" — скрыть)

  // 🎈 возраст. age — цифра, balloonsImg — имя файла картинки (если есть).
  //    Оба "" → ничего не показывается.
  age: "18",                     // сколько ей исполняется, напр. "18". "" — цифры не показываются
  balloonsImg: "",

  // 💬 ТЕКСТ. Каждая строка = абзац. [] → бледная заглушка.
  message: [
    "С днём рождения!",
    "Желаю тебе больших возможностей, громких достижений, счастья, любви и крепкого здоровья.",
    "Впереди новый этап жизни, тебе исполнилось 18. Пусть он будет ярким и насыщенным.",
    "Надеюсь, тебе понравился этот подарок)"
  ],

  footTo: "с днём рождения,",
  footBig: "Саша",
  footFrom: "",

  // 🎵 музыка — положи mp3 в корень и впиши имя файла. "" уберёт кнопку.
  music: "music.mp3",

  // 📸 фото + подписи (всплывают при наведении/тапе). Меняй свободно.
  photos: [
    { src:"g1.jpg", cap:"" },
    { src:"g2.jpg", cap:"" },
    { src:"g3.jpg", cap:"" }
  ]
};
/* ================================================================== */

const $=id=>document.getElementById(id);
$("eyebrow").textContent=DATA.eyebrow;
$("footTo").textContent=DATA.footTo;
$("footBig").textContent=DATA.footBig;
$("footFrom").textContent=DATA.footFrom;
document.title=DATA.name+", "+DATA.eyebrow;
// имя по буквам
$("name").innerHTML=[...DATA.name].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join("");
$("plTitle").textContent=DATA.song||"музыка";
if(!DATA.footFrom)$("footFrom").style.display="none";
// бегущая лента
{const unit=`<span>${DATA.eyebrow} ✦ ${DATA.name} ✦</span>`;$("band").innerHTML=unit.repeat(12);}

// подзаголовок
if(DATA.subline){$("subline").textContent=DATA.subline;}else{$("subline").style.display="none";}

// возраст: цифры-шарики
if(DATA.age){$("age").innerHTML=[...String(DATA.age)].map((c,i)=>`<img class="dg bln-d" src="num${c}.png" alt="" style="--rot:${i%2?4:-4}deg;--dl:${i*.4}s">`).join("");}
else{$("age").style.display="none";}

// текст
$("msgBody").innerHTML = (DATA.message && DATA.message.length)
  ? DATA.message.map(t=>`<p>${t}</p>`).join("")
  : `<p class="placeholder">(здесь будет текст — впиши его в DATA.message)</p>`;

// галерея
const m=$("masonry");
DATA.photos.forEach((p,i)=>{
  const d=document.createElement("div");
  d.className="card-ph";
  d.innerHTML=`<img src="${p.src}" alt="" loading="lazy">`+(p.cap?`<div class="cap">${p.cap}</div>`:"");
  d.addEventListener("click",()=>openLB(i));
  m.appendChild(d);
});

// появление при скролле
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");io.unobserve(e.target)}});
},{threshold:.15});
document.querySelectorAll(".card-ph").forEach((c,i)=>{c.style.setProperty("--r",[-2,1.6,-1.2,2][i%4]+"deg");c.style.transitionDelay=(i%3*80)+"ms";io.observe(c)});

// ---- лайтбокс с листанием (свайп / стрелки / клавиши) ----
const lb=$("lb"),lbImg=$("lbImg");
const lbList=DATA.photos.map(p=>p.src);
let lbIdx=0;
function openLB(i){lbIdx=i;lbImg.src=lbList[i];lb.classList.add("open");}
function lbGo(d){lbIdx=(lbIdx+d+lbList.length)%lbList.length;lbImg.src=lbList[lbIdx];}
function lbClose(){lb.classList.remove("open");}
$("lbClose").addEventListener("click",e=>{e.stopPropagation();lbClose();});
$("lbPrev").addEventListener("click",e=>{e.stopPropagation();lbGo(-1);});
$("lbNext").addEventListener("click",e=>{e.stopPropagation();lbGo(1);});
lb.addEventListener("click",e=>{if(e.target===lb)lbClose();});
lbImg.addEventListener("click",e=>e.stopPropagation());
let _tx=0;
lb.addEventListener("touchstart",e=>{_tx=e.touches[0].clientX;},{passive:true});
lb.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>40)lbGo(dx<0?1:-1);},{passive:true});
addEventListener("keydown",e=>{
  if(!lb.classList.contains("open"))return;
  if(e.key==="Escape")lbClose();
  else if(e.key==="ArrowLeft")lbGo(-1);
  else if(e.key==="ArrowRight")lbGo(1);
});

// музыка (автоплей + скрытая перемотка)
const bgm=$("bgm"),musicBtn=$("musicBtn"),musicWrap=$("musicWrap"),seek=$("seek");
if(DATA.music){
  bgm.src=DATA.music;musicWrap.style.display="flex";
  const setP=on=>{musicBtn.classList.toggle("playing",on);musicWrap.classList.toggle("on",on);};
  const play=()=>bgm.play().then(()=>setP(true)).catch(()=>{});
  const toggle=()=>{ if(bgm.paused){play();} else{bgm.pause();setP(false);} };
  const revealSeek=()=>{};
  musicBtn.addEventListener("click",()=>{toggle();revealSeek();});
  bgm.addEventListener("timeupdate",()=>{if(bgm.duration){seek.value=(bgm.currentTime/bgm.duration)*1000;seek.style.setProperty("--p",(seek.value/10)+"%");}});
  seek.addEventListener("input",()=>{if(bgm.duration){bgm.currentTime=(seek.value/1000)*bgm.duration;seek.style.setProperty("--p",(seek.value/10)+"%");}});
  play();
}

// лёгкий параллакс героя
const heroImg=document.querySelector(".hero-img");
addEventListener("scroll",()=>{const y=scrollY;if(y<innerHeight*1.2)heroImg.style.backgroundPosition="center "+(50+y*0.04)+"%";},{passive:true});

// искры: ✦, мерцают на месте (сдержанно)
const sky=$("sky");
function mkSpark(blue){
  const e=document.createElement("div");
  e.className="spark"+(blue?" blue":"");
  e.textContent="✦";
  e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;`
    +`font-size:${7+Math.random()*12}px;--d:${4+Math.random()*4}s;--delay:${Math.random()*5}s`;
  sky.appendChild(e);
}
for(let i=0;i<18;i++)mkSpark(Math.random()<0.5);

// ---- конфетти: при открытии + хлопок шариков ----
const cv=$("confetti"),ctx=cv.getContext("2d");
let W,H;const resize=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;};
resize();addEventListener("resize",resize);
const colors=["#6fa8dc","#9fc5e8","#cfe0f0","#ffffff","#bcd4ea","#7fb0d8"];
let P=[],running=false;
function frame(){
  ctx.clearRect(0,0,W,H);
  P=P.filter(p=>p.y<H+30);
  for(const p of P){
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.vx*=p.drag;p.vx+=Math.sin(p.y*0.01)*0.04;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
    if(p.sq)ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);else{ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.28);ctx.fill();}
    ctx.restore();
  }
  if(P.length)requestAnimationFrame(frame);else{running=false;ctx.clearRect(0,0,W,H);}
}
function start(){if(!running){running=true;requestAnimationFrame(frame);}}
const still=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
if(!still){
  for(let i=0;i<120;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*0.6,vx:(Math.random()-0.5)*1.5,
    vy:2+Math.random()*3.4,g:.02,drag:1,s:5+Math.random()*7,rot:Math.random()*6.28,
    vr:(Math.random()-0.5)*0.3,c:colors[i%colors.length],sq:Math.random()<0.5});
  setTimeout(start,350);
}
function burst(x,y){
  if(still)return;
  for(let i=0;i<46;i++){const a=Math.random()*6.28,v=2+Math.random()*6;
    P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.18,drag:.97,s:4+Math.random()*6,rot:Math.random()*6.28,
      vr:(Math.random()-0.5)*0.4,c:colors[i%colors.length],sq:Math.random()<0.5});}
  start();
}
// лопаем шарики по тапу
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest(".bln");
  if(!b||b.classList.contains("pop"))return;
  const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*0.4);
  b.classList.add("pop");
});
// подвал: шарики взлетают, когда доскроллили
new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");o.disconnect();}}),{threshold:.25}).observe($("foot"));
</script>
</body>
</html>
