<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Поздравляю 🤍</title>

<!--
==================================================================
  ✏️  МЕНЯТЬ ТУТ — всё персональное в блоке  const DATA = { ... }
      ниже в скрипте: имя, подзаголовок, ТЕКСТ, подписи к фото.
  🎈 Возраст/шарики — через DATA.age и DATA.balloonsImg (можно оставить "" — не покажется)
  🎵 Музыка — положи mp3 в корень, впиши имя файла в DATA.music ("" убирает кнопку)
  Картинки лежат в КОРНЕ репозитория (рядом с index.html).
==================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#f4f8fc;
  --bg2:#dce9f5;
  --mist:#cfe0f0;
  --blue:#6fa8dc;
  --blue-deep:#3d6fa3;
  --steel:#2f5273;
  --ink:#44566b;
  --cream:#fcfeff;
  --shadow:24px 40px 80px -42px rgba(47,82,115,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);background:var(--bg1);
  overflow-x:hidden;line-height:1.6}

.bg{position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(60% 45% at 18% 10%, #eaf3fb 0%, transparent 60%),
    radial-gradient(55% 40% at 85% 22%, #e3edf6 0%, transparent 55%),
    radial-gradient(70% 55% at 50% 108%, #cfe1f2 0%, transparent 60%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 58%, #cfe0f0 100%);}

/* конфетти-слой */
#confetti{position:fixed;inset:0;z-index:45;pointer-events:none}

/* атмосфера: тонкие искры, мерцают на месте */
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.spark{position:absolute;color:#fff;filter:drop-shadow(0 0 6px rgba(130,180,225,.9));
  animation:twinkle var(--d,5s) ease-in-out infinite;animation-delay:var(--delay,0s)}
.spark.blue{color:#cfe4f6;filter:drop-shadow(0 0 7px rgba(111,168,220,.9))}
@keyframes twinkle{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.8;transform:scale(1.05)}}

/* ---- HERO ---- */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;
  justify-content:center;overflow:hidden}
.hero-img{position:absolute;inset:0;background:url("hero.jpg") center/cover no-repeat;
  transform:scale(1.07);animation:heroZoom 15s ease-out forwards}
@keyframes heroZoom{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(40,70,110,.10) 0%, transparent 30%,
    rgba(30,55,90,.18) 60%, rgba(25,45,75,.62) 100%)}
.hero-inner{position:relative;z-index:2;text-align:center;padding:0 24px 12vh;color:#fff}
.eyebrow{font-weight:600;font-size:clamp(13px,3.6vw,17px);letter-spacing:.34em;
  text-transform:uppercase;opacity:0;animation:rise .9s .3s ease both;
  text-shadow:0 2px 18px rgba(20,45,80,.6)}
.name{font-family:"Playfair Display",serif;font-weight:500;
  font-size:clamp(60px,17vw,122px);line-height:1.0;margin:.08em 0 .14em;letter-spacing:.01em;
  text-shadow:0 6px 34px rgba(20,45,80,.5);
  opacity:0;animation:rise 1s .55s ease both}
.age{opacity:0;animation:rise 1s .8s ease both;margin:0 0 .3em}
.age .num{font-family:"Playfair Display",serif;font-size:clamp(34px,11vw,66px);line-height:1;
  color:#eaf4ff;text-shadow:0 4px 22px rgba(47,82,115,.7), 0 0 40px rgba(130,180,225,.5)}
.age img{max-width:min(50vw,230px);height:auto;filter:drop-shadow(0 10px 24px rgba(30,60,100,.45))}
.subline{font-weight:500;font-size:clamp(15px,4.4vw,20px);letter-spacing:.04em;
  opacity:0;animation:rise 1s 1.05s ease both;text-shadow:0 2px 16px rgba(20,45,80,.55)}
.scroll-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:2;
  color:#fff;text-align:center;opacity:0;
  animation:riseC 1s 1.5s ease both, bob 2.4s 2.1s ease-in-out infinite}
.scroll-hint b{display:block;font-weight:600;font-size:12px;letter-spacing:.28em;
  text-transform:uppercase;opacity:.88}
.scroll-hint .arw{font-size:20px;line-height:1;opacity:.8;margin-top:2px}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes riseC{from{opacity:0;transform:translate(-50%,26px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}

/* ---- MESSAGE ---- */
.message{max-width:640px;margin:0 auto;padding:14vh 30px 8vh;text-align:center}
.message p{font-size:clamp(16px,4.2vw,19px);color:var(--ink);margin-bottom:16px}
.message .placeholder{color:#9bb2c8;font-style:italic}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;
  margin:34px 0 0;color:var(--blue);font-size:14px;letter-spacing:.3em}
.divider::before,.divider::after{content:"";height:1px;width:66px;
  background:linear-gradient(90deg,transparent,var(--mist))}
.divider::after{background:linear-gradient(90deg,var(--mist),transparent)}

/* ---- GALLERY ---- */
.gallery-wrap{padding:2vh 16px 8vh;max-width:920px;margin:0 auto}
.masonry{column-count:2;column-gap:14px}
@media(min-width:720px){.masonry{column-count:3;column-gap:18px}}
.card-ph{break-inside:avoid;margin-bottom:14px;position:relative;border-radius:18px;
  overflow:hidden;box-shadow:var(--shadow);background:var(--cream);cursor:pointer;
  opacity:0;transform:translateY(30px) scale(.98);transition:transform .7s ease,opacity .7s ease}
.card-ph.show{opacity:1;transform:none}
.card-ph img{display:block;width:100%;height:auto;transition:transform .6s ease}
.card-ph:hover img{transform:scale(1.05)}
.card-ph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(30,60,100,.38));opacity:0;transition:.4s}
.card-ph:hover::after{opacity:1}
.cap{position:absolute;left:12px;bottom:10px;right:12px;z-index:2;color:#fff;
  font-weight:600;font-size:18px;opacity:0;transform:translateY(6px);transition:.4s;
  text-shadow:0 2px 10px rgba(20,40,70,.7)}
.card-ph:hover .cap{opacity:1;transform:none}

/* ---- FOOTER ---- */
.foot{text-align:center;padding:6vh 24px 12vh}
.foot .to{font-weight:600;font-size:clamp(14px,3.8vw,17px);letter-spacing:.26em;
  text-transform:uppercase;color:var(--blue-deep);margin-bottom:6px}
.foot .big{font-family:"Playfair Display",serif;font-style:italic;color:var(--steel);
  font-size:clamp(40px,13vw,74px);line-height:1.05;margin-bottom:16px}
.foot .from{font-weight:500;color:var(--ink);font-size:clamp(14px,4vw,17px);
  letter-spacing:.16em;text-transform:lowercase}

/* ---- MUSIC ---- */
.music-wrap{position:fixed;right:16px;bottom:16px;z-index:40;display:none;
  flex-direction:column;align-items:center;gap:10px}
.music-btn{position:relative;width:56px;height:56px;border:none;border-radius:50%;
  cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--blue-deep));
  box-shadow:0 10px 26px -6px rgba(47,82,115,.6);
  display:flex;align-items:center;justify-content:center;transition:transform .25s ease}
.music-btn:active{transform:scale(.9)}
.music-btn svg{width:22px;height:22px;fill:#fff}
.music-btn .i-pause{display:none}
.music-btn.playing .i-play{display:none}
.music-btn.playing .i-pause{display:block}
.music-btn.playing::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  border:2px solid rgba(111,168,220,.5);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.seek{width:120px;accent-color:var(--blue);cursor:pointer;
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .25s ease,transform .25s ease}
.music-wrap:hover .seek,.seek.show{opacity:1;transform:none;pointer-events:auto}

/* ---- LIGHTBOX ---- */
.lb{position:fixed;inset:0;z-index:50;background:rgba(25,45,75,.88);
  backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.lb.open{display:flex;animation:fade .3s ease}
.lb img{max-width:100%;max-height:88vh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:34px;cursor:pointer;
  line-height:1;opacity:.9;z-index:3}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;color:#fff;
  font-size:46px;line-height:1;cursor:pointer;opacity:.8;user-select:none;
  padding:12px 14px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.lb-nav:active{opacity:.45}
.lb-prev{left:4px}.lb-next{right:4px}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .card-ph{opacity:1;transform:none}.hero-img{transform:scale(1)}
  .eyebrow,.name,.age,.subline,.scroll-hint{opacity:1}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="sky" id="sky"></div>
<canvas id="confetti"></canvas>

<!-- HERO -->
<header class="hero">
  <div class="hero-img"></div>
  <div class="hero-inner">
    <div class="eyebrow" id="eyebrow">С днём рождения</div>
    <h1 class="name" id="name">Имя</h1>
    <div class="age" id="age"></div>
    <div class="subline" id="subline"></div>
  </div>
  <div class="scroll-hint"><b>листай вниз</b><div class="arw">↓</div></div>
</header>

<!-- MESSAGE -->
<section class="message">
  <div id="msgBody"></div>
  <div class="divider">✦&nbsp;&nbsp;✦&nbsp;&nbsp;✦</div>
</section>

<!-- GALLERY -->
<section class="gallery-wrap">
  <div class="masonry" id="masonry"></div>
</section>

<!-- FOOTER -->
<footer class="foot">
  <div class="to" id="footTo">С днём рождения</div>
  <div class="big" id="footBig">Имя</div>
  <div class="from" id="footFrom">с любовью</div>
</footer>

<!-- MUSIC -->
<audio id="bgm" loop preload="auto"></audio>
<div class="music-wrap" id="musicWrap">
  <input type="range" class="seek" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
  <button class="music-btn" id="musicBtn" aria-label="Музыка">
    <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <div class="lb-close" id="lbClose">✕</div>
  <div class="lb-nav lb-prev" id="lbPrev">‹</div>
  <img id="lbImg" alt="">
  <div class="lb-nav lb-next" id="lbNext">›</div>
</div>

<script>
/* ==================================================================
   ✏️  ВСЁ ПЕРСОНАЛЬНОЕ — МЕНЯЙ ТОЛЬКО ЗДЕСЬ
   ================================================================== */
const DATA = {
  name: "Имя",
  eyebrow: "С днём рождения",   // верхняя строчка (повод)
  subline: "",                   // подзаголовок/прозвище под именем ("" — скрыто)

  // 🎈 возраст. age — цифра, balloonsImg — имя файла картинки (если есть).
  //    Оба "" → ничего не показывается.
  age: "",
  balloonsImg: "",

  // 💬 ТЕКСТ. Каждая строка = абзац. [] → бледная заглушка.
  message: [
    // "Первый абзац...",
    // "Второй абзац...",
  ],

  footTo: "С днём рождения",
  footBig: "Имя",
  footFrom: "с любовью",

  // 🎵 музыка — положи mp3 в корень и впиши имя файла. "" уберёт кнопку.
  music: "",

  // 📸 фото + подписи (всплывают при наведении/тапе). Меняй свободно.
  photos: [
    { src:"g1.jpg", cap:"" },
    { src:"g2.jpg", cap:"" },
    { src:"g3.jpg", cap:"" }
  ]
};
/* ================================================================== */

const $=id=>document.getElementById(id);
$("name").textContent=DATA.name;
$("eyebrow").textContent=DATA.eyebrow;
$("footTo").textContent=DATA.footTo;
$("footBig").textContent=DATA.footBig;
$("footFrom").textContent=DATA.footFrom;
document.title=DATA.eyebrow+", "+DATA.name+" 🤍";

// подзаголовок
if(DATA.subline){$("subline").textContent=DATA.subline;}else{$("subline").style.display="none";}

// возраст: картинка, или цифра, или ничего
if(DATA.balloonsImg){$("age").innerHTML=`<img src="${DATA.balloonsImg}" alt="${DATA.age}">`;}
else if(DATA.age){$("age").innerHTML=`<span class="num">${DATA.age}</span>`;}
else{$("age").style.display="none";}

// текст
$("msgBody").innerHTML = (DATA.message && DATA.message.length)
  ? DATA.message.map(t=>`<p>${t}</p>`).join("")
  : `<p class="placeholder">(здесь будет текст — впиши его в DATA.message)</p>`;

// галерея
const m=$("masonry");
DATA.photos.forEach((p,i)=>{
  const d=document.createElement("div");
  d.className="card-ph";
  d.innerHTML=`<img src="${p.src}" alt="" loading="lazy">`+(p.cap?`<div class="cap">${p.cap}</div>`:"");
  d.addEventListener("click",()=>openLB(i));
  m.appendChild(d);
});

// появление при скролле
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");io.unobserve(e.target)}});
},{threshold:.15});
document.querySelectorAll(".card-ph").forEach((c,i)=>{c.style.transitionDelay=(i%3*80)+"ms";io.observe(c)});

// ---- лайтбокс с листанием (свайп / стрелки / клавиши) ----
const lb=$("lb"),lbImg=$("lbImg");
const lbList=DATA.photos.map(p=>p.src);
let lbIdx=0;
function openLB(i){lbIdx=i;lbImg.src=lbList[i];lb.classList.add("open");}
function lbGo(d){lbIdx=(lbIdx+d+lbList.length)%lbList.length;lbImg.src=lbList[lbIdx];}
function lbClose(){lb.classList.remove("open");}
$("lbClose").addEventListener("click",e=>{e.stopPropagation();lbClose();});
$("lbPrev").addEventListener("click",e=>{e.stopPropagation();lbGo(-1);});
$("lbNext").addEventListener("click",e=>{e.stopPropagation();lbGo(1);});
lb.addEventListener("click",e=>{if(e.target===lb)lbClose();});
lbImg.addEventListener("click",e=>e.stopPropagation());
let _tx=0;
lb.addEventListener("touchstart",e=>{_tx=e.touches[0].clientX;},{passive:true});
lb.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>40)lbGo(dx<0?1:-1);},{passive:true});
addEventListener("keydown",e=>{
  if(!lb.classList.contains("open"))return;
  if(e.key==="Escape")lbClose();
  else if(e.key==="ArrowLeft")lbGo(-1);
  else if(e.key==="ArrowRight")lbGo(1);
});

// музыка (автоплей + скрытая перемотка)
const bgm=$("bgm"),musicBtn=$("musicBtn"),musicWrap=$("musicWrap"),seek=$("seek");
if(DATA.music){
  bgm.src=DATA.music;musicWrap.style.display="flex";
  const setP=on=>musicBtn.classList.toggle("playing",on);
  const play=()=>bgm.play().then(()=>setP(true)).catch(()=>{});
  const toggle=()=>{ if(bgm.paused){play();} else{bgm.pause();setP(false);} };
  let showT;
  const revealSeek=()=>{seek.classList.add("show");clearTimeout(showT);
    showT=setTimeout(()=>seek.classList.remove("show"),4000);};
  musicBtn.addEventListener("click",()=>{toggle();revealSeek();});
  bgm.addEventListener("timeupdate",()=>{if(bgm.duration)seek.value=(bgm.currentTime/bgm.duration)*1000;});
  seek.addEventListener("input",()=>{if(bgm.duration)bgm.currentTime=(seek.value/1000)*bgm.duration;revealSeek();});
  play();
  ["pointerdown","touchstart","keydown","scroll"].forEach(ev=>
    addEventListener(ev,()=>{if(bgm.paused)play();},{once:true,passive:true}));
}

// искры: ✦, мерцают на месте (сдержанно)
const sky=$("sky");
function mkSpark(blue){
  const e=document.createElement("div");
  e.className="spark"+(blue?" blue":"");
  e.textContent="✦";
  e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;`
    +`font-size:${7+Math.random()*12}px;--d:${4+Math.random()*4}s;--delay:${Math.random()*5}s`;
  sky.appendChild(e);
}
for(let i=0;i<18;i++)mkSpark(Math.random()<0.5);

// ---- конфетти при открытии (голубое, скромное) ----
(function(){
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const cv=$("confetti"),ctx=cv.getContext("2d");
  let W,H;
  const resize=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;};
  resize();addEventListener("resize",resize);
  const colors=["#6fa8dc","#9fc5e8","#cfe0f0","#ffffff","#bcd4ea","#7fb0d8"];
  const P=[];
  for(let i=0;i<120;i++){
    P.push({x:Math.random()*W,y:-20-Math.random()*H*0.6,vx:(Math.random()-0.5)*1.5,
      vy:2+Math.random()*3.4,s:5+Math.random()*7,rot:Math.random()*6.28,
      vr:(Math.random()-0.5)*0.3,c:colors[i%colors.length],sq:Math.random()<0.5});
  }
  function frame(){
    ctx.clearRect(0,0,W,H);let alive=0;
    for(const p of P){
      if(p.y>H+30)continue;alive++;
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;p.rot+=p.vr;p.vx+=Math.sin(p.y*0.01)*0.05;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
      if(p.sq)ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);
      else{ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.28);ctx.fill();}
      ctx.restore();
    }
    if(alive>0)requestAnimationFrame(frame);else ctx.clearRect(0,0,W,H);
  }
  setTimeout(()=>requestAnimationFrame(frame),350);
})();
</script>
</body>
</html>
